[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magicbox"
version = "0.1.0"
description = "Magic Box: Dateien automatisiert statisch analysieren (Reverse Engineering) und per lokalem LLM verständlich dokumentieren."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pefile>=2023.2.7",
    "pyelftools>=0.30",
    "capstone>=5.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
# Malware-Suite: YARA, Office-Makros, .NET-Metadaten, AES-ZIPs
malware = ["yara-python>=4.3", "oletools>=0.60", "dnfile>=0.15", "pyzipper>=0.3.6"]
# Desktop-App (natives Fenster mit eingebettetem Chromium)
desktop = ["PySide6>=6.6"]
# capa als Python-Paket (alternativ die Standalone-Binary von Mandiant nutzen)
capa = ["flare-capa>=7"]
dev = ["pytest>=7"]

[project.scripts]
magicbox = "magicbox.cli:main"

[project.gui-scripts]
magicbox-desktop = "magicbox.gui.app:main"

[tool.setuptools.packages.find]
include = ["magicbox*"]

[tool.setuptools.package-data]
magicbox = ["report/*.css", "web/*", "yara_rules/*.yar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
