name: Desktop-Installer (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "magicbox/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-installer.yml"

permissions:
  contents: write  # nur für das Anhängen an Releases bei Tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop,malware]" pyinstaller

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: App bündeln (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/magicbox.spec

      - name: Selbsttest des Bundles
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MagicBox\MagicBox.exe" -ArgumentList "--selftest","dist\selftest.json" -Wait -PassThru
          Get-Content dist\selftest.json
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Exit $($p.ExitCode))" }

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Installer bauen
        shell: pwsh
        run: '& $env:ISCC "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss'

      - name: Installer testen (still installieren, Vorgabe prüfen, deinstallieren)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\MagicBox-Setup-*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\MagicBoxTest"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$dir","/SERVER=https://magicbox.example.test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation fehlgeschlagen ($($p.ExitCode))" }
          $defaults = Get-Content "$dir\magicbox-defaults.json" -Raw
          Write-Host "magicbox-defaults.json: $defaults"
          if ($defaults -notmatch 'magicbox\.example\.test') { throw "Server-Vorgabe fehlt" }
          $st = Start-Process "$dir\MagicBox.exe" -ArgumentList "--selftest","$env:RUNNER_TEMP\st.json" -Wait -PassThru
          if ($st.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\st.json"; throw "Installierte App: Selbsttest fehlgeschlagen" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen" }
          Write-Host "Installieren, Starten, Deinstallieren: OK"

      - uses: actions/upload-artifact@v4
        with:
          name: MagicBox-Setup-${{ steps.version.outputs.version }}
          path: dist/MagicBox-Setup-*.exe
          if-no-files-found: error

      - name: An Release anhängen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MagicBox-Setup-*.exe
